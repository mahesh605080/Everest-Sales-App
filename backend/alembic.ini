[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
# The database address comes from DATABASE_URL (see migrations/env.py); nothing is written here.

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s %(message)s
