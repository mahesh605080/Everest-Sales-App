# Start everything:  docker compose up -d --build
# Needs a .env file next to this one (copy .env.example) with DB_PASSWORD, AUTH_SECRET and DOMAIN set.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sfa
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: sfa
      TZ: Asia/Kathmandu
      PGTZ: Asia/Kathmandu
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfa -d sfa"]
      interval: 5s
      retries: 20

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sfa:${DB_PASSWORD}@db:5432/sfa
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:-Everest@123}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CRON_SECRET: ${CRON_SECRET:-}   # lets the platform's scheduler run the alert rules; 16+ random characters
      SESSION_IDLE_DAYS: ${SESSION_IDLE_DAYS:-7}
      TZ: Asia/Kathmandu

  # Platform services in Python (sessions, realtime, files, notifications, jobs). Same database, its own schema "platform".
  platform:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started   # the web app creates the people and roles tables the platform reads
    environment:
      DATABASE_URL: postgresql://sfa:${DB_PASSWORD}@db:5432/sfa
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      PLATFORM_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      FILES_DIR: /data/files
      PUBLIC_URL: https://${DOMAIN}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      WEB_INTERNAL_URL: http://app:3000
      CRON_SECRET: ${CRON_SECRET:-}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      FILE_MAX_BYTES: ${FILE_MAX_BYTES:-10485760}
      FILE_QUOTA_BYTES: ${FILE_QUOTA_BYTES:-209715200}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-1200}
      NOTIFY_MAX_ATTEMPTS: ${NOTIFY_MAX_ATTEMPTS:-6}
      NOTIFY_MAX_PER_USER_PER_HOUR: ${NOTIFY_MAX_PER_USER_PER_HOUR:-30}
      NOTIFY_PARALLEL: ${NOTIFY_PARALLEL:-8}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      APNS_KEY: ${APNS_KEY:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      APNS_SANDBOX: ${APNS_SANDBOX:-false}
      TZ: Asia/Kathmandu
    volumes:
      - filedata:/data/files
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health/ready').status==200 else 1)"]
      interval: 15s
      retries: 10

  # Backups. Not started with the rest; run by hand or from the server's cron (see docs/platform/DEPLOYMENT.md):
  #   docker compose run --rm backup                                     one backup into ./backups
  #   docker compose run --rm backup sh /scripts/verify-backup.sh        restore the newest into a throw-away database and compare
  backup:
    image: postgres:16-alpine
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sfa:${DB_PASSWORD}@db:5432/sfa
      FILES_DIR: /data/files
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      RESTORE_REPLACE: ${RESTORE_REPLACE:-}
      TZ: Asia/Kathmandu
    volumes:
      - filedata:/data/files
      - ./backups:/backups
      - ./scripts:/scripts:ro
    entrypoint: []
    command: ["sh", "/scripts/backup.sh"]

  # Gives the site an https address with an automatic certificate. Point your domain's DNS at this server first.
  # /api/v1 and /ws go to the platform service; everything else to the web app.
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app, platform]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data

volumes:
  dbdata:
  caddydata:
  filedata:
